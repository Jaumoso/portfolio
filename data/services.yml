  # --- My own projects ------------------------------------------------------
  kalenda:
    name: Kalenda
    category: own
    own: true
    description: Self-hosted wall-calendar designer with PDF/PNG export.
    use: Designing personalised photo wall calendars.
    url: https://github.com/Jaumoso/kalenda
  photodiff:
    name: photodiff
    category: own
    own: true
    description: Simple front-end to compare two photos and spot differences.
    url: https://github.com/Jaumoso/photodiff
