  # --- Dev & web tools ------------------------------------------------------
  it-tools:
    name: IT-Tools
    category: tools
    description: Collection of handy developer utilities.
    url: https://github.com/CorentinTh/it-tools
  cyberchef:
    name: CyberChef
    category: tools
    description: The "cyber Swiss army knife" for data encoding and analysis.
    url: https://github.com/gchq/CyberChef
  littlelink:
    name: LittleLink
    category: tools
    description: Self-hosted link-in-bio page.
    url: https://github.com/techno-tim/littlelink-server

  # --- Dashboards -----------------------------------------------------------
  homarr:
    name: Homarr
    category: dashboards
    description: Customisable homelab dashboard.
    use: Start page with links and widgets for every service.
    url: https://github.com/homarr-labs/homarr
  glance:
    name: Glance
    category: dashboards
    description: Minimal feed dashboard (RSS, releases, weather, markets).
